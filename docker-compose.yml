# Production-ready docker-compose for JobTracker
# Services: db, redis, backend, celery_worker, celery_beat, frontend, nginx
# Internal network "jobnet"; nginx exposes :80 to host.
name: jobtracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker_pw}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtracker} -d ${POSTGRES_DB:-jobtracker}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jobnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jobnet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "alembic upgrade head &&
             python -m app.utils.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [jobnet]

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info"]
    networks: [jobnet]

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "--loglevel=info"]
    networks: [jobnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/v1/ws/notifications}
    depends_on:
      backend: { condition: service_started }
    expose: ["3000"]
    networks: [jobnet]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend: { condition: service_started }
      frontend: { condition: service_started }
    networks: [jobnet]

volumes:
  db_data:
  redis_data:

networks:
  jobnet:
    driver: bridge
