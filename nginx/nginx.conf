worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 16m;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    application/javascript application/json application/xml+rss
    application/octet-stream image/svg+xml text/css text/plain text/xml;

  # Static asset cache (Next.js immutable)
  map $sent_http_content_type $asset_cache {
    default off;
    "~image/"          "public, max-age=31536000, immutable";
    "~font/"           "public, max-age=31536000, immutable";
    "~application/javascript" "public, max-age=31536000, immutable";
    "~text/css"        "public, max-age=31536000, immutable";
  }
  

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80 default_server;
    server_name _;

    # API
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # WebSocket
    location /api/v1/ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location = /health {
      proxy_pass http://backend/health;
    }
    location /docs    { proxy_pass http://backend; }
    location /redoc   { proxy_pass http://backend; }
    location /openapi.json { proxy_pass http://backend; }

    # Frontend static (Next standalone)
    location /_next/static/ {
      proxy_pass http://frontend;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Frontend (SPA fallback handled by Next router)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
